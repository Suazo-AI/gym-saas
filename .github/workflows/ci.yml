name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Revisar estilo con ESLint
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      # src/lib/env.ts valida las variables al cargar el modulo, asi que el build
      # falla sin ellas. Estos valores son ficticios y solo permiten compilar: no
      # apuntan a ningun Supabase real y no se hace ninguna llamada de red en build.
      # Las credenciales reales viven en Vercel, nunca aqui.
      - name: Compilar la aplicacion
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-no-es-una-clave-real
          NEXT_PUBLIC_SITE_URL: https://example.com

  # El job de arriba solo mira Node. services/face-recognition/ es Python y
  # hasta ahora no lo ejecutaba nadie, aunque ahi vive la dimension del
  # embedding facial. Corre siempre y no con filtro de rutas: son ~25 s
  # medidos, y eso no justifica la complejidad de un paths-filter.
  face-service:
    name: Pruebas del servicio de reconocimiento facial
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/face-recognition/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt
        working-directory: services/face-recognition

      - name: Ejecutar pruebas
        run: python -m unittest discover -v
        working-directory: services/face-recognition
