name: Base de datos

# Va en un workflow aparte y no dentro de ci.yml a proposito: levantar Supabase
# necesita Docker en el runner y tarda, y un PR que solo toca UI no tiene por
# que esperarlo.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    name: Pruebas pgTAP del esquema
    runs-on: ubuntu-latest

    # PRIMERA CORRIDA: no bloquea. El baseline local no se pudo medir limpio
    # porque el stack de Supabase se comparte entre worktrees y la base quedo
    # con migraciones de otra rama. Esta corrida ES el baseline: cuando se
    # conozca el numero real de aserciones, se quita este flag y pasa a
    # bloquear el merge.
    continue-on-error: true

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El CLI de supabase es devDependency, no esta en PATH: se usa por script
      # npm, que resuelve el binario de node_modules/.bin.
      - name: Levantar la base local
        run: npx supabase db start

      - name: Ejecutar pruebas pgTAP
        run: npm run test:db

      - name: Apagar la base
        if: always()
        run: npx supabase stop --no-backup
