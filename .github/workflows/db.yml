name: Base de datos

# Va en un workflow aparte y no dentro de ci.yml a proposito: levantar Supabase
# necesita Docker en el runner y tarda, y un PR que solo toca UI no tiene por
# que esperarlo.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    name: Pruebas pgTAP del esquema
    runs-on: ubuntu-latest

    # Baseline medido en la primera corrida de este job: Files=16, Tests=148,
    # todo en verde sobre una base creada desde cero. Con ese numero conocido el
    # job pasa a bloquear el merge, que era el objetivo.
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El CLI de supabase es devDependency, no esta en PATH: se usa por script
      # npm, que resuelve el binario de node_modules/.bin.
      - name: Levantar la base local
        run: npx supabase db start

      - name: Ejecutar pruebas pgTAP
        run: npm run test:db

      - name: Apagar la base
        if: always()
        run: npx supabase stop --no-backup
